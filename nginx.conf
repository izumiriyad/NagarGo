# NagarGo Final Enterprise API Gateway
# Intended to be placed in /etc/nginx/nginx.conf on the production host

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Logging configuration
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Performance optimizations
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;

    # Rate limiting zone (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Backend Node.js API (PM2 Cluster)
    upstream api_backend {
        server 127.0.0.1:5000;
    }

    # Frontend Next.js Web
    upstream web_frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name nagargo.example.com; # Replace with real domain

        # Redirect all HTTP traffic to HTTPS (Requires SSL Cert setup)
        # return 301 https://$host$request_uri;

        # Route API Traffic
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Apply rate limiting
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Route Socket.io Traffic
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Route Web Traffic
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
