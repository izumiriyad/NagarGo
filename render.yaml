services:
  - type: web
    name: nagargo-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set these in the Render dashboard after deploy — Render
      # blueprints intentionally don't store secrets in this file:
      #   MONGODB_URI            — ALREADY PROVISIONED for you: copy
      #                            the real value from apps/api/.env
      #                            in this zip (MongoDB Atlas project
      #                            "NagarGo", cluster "nagargo-cluster")
      #   JWT_SECRET             (generate: openssl rand -hex 48)
      #   JWT_REFRESH_SECRET     (generate: openssl rand -hex 48)
      #   APP_BASE_URL           (your Vercel URL(s), comma-separated)
      #   API_BASE_URL           (this service's own Render URL, once known)
      #   ADMIN_BOOTSTRAP_PIN
      #   GOOGLE_MAPS_API_KEY
      #   TELEGRAM_BOT_TOKEN
      #   TELEGRAM_CHAT_ID
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_PIN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      # Persists rider/prescription uploads across deploys — same
      # role as the nagargo_uploads Docker volume. Swap for
      # Cloudinary/S3 (see storageService.ts) once you outgrow this.
      # NOTE: verify this path against your service's actual working
      # directory in the Render deploy logs — the exact prefix can
      # vary; it should resolve to <repo checkout>/apps/api/uploads.
      name: nagargo-uploads
      mountPath: /opt/render/project/src/apps/api/uploads
      sizeGB: 1
