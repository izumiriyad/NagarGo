version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nagargo_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/nagargo_dev
    ports:
      - "4000:4000"
    volumes:
      # Local-disk upload adapter (NID docs, prescriptions) needs a
      # persistent volume or every rebuild wipes uploaded files. Swap
      # for Cloudinary/S3 in production and drop this volume — see
      # apps/api/src/services/storageService.ts.
      - nagargo_uploads:/app/uploads
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        # Passed at BUILD time on purpose — see the note in
        # apps/web/Dockerfile. Sourced from the root .env file.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  nagargo_mongo_data:
  nagargo_uploads:
  redis_data:
